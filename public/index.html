<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparte las fotos y videos de nuestra Boda</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería de Confeti / Fuegos artificiales -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.min.js"></script>
    <style>
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.4)), url('/img/Boda_1.jpeg');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-end sm:justify-center items-center p-4 pb-8 sm:pb-4">

    <!-- Tarjeta muy transparente (glassmorphism sutil) -->
    <div class="bg-white/35 backdrop-blur-md p-6 sm:p-8 rounded-3xl shadow-2xl max-w-md w-full text-center border border-white/40">
        <h1 class="text-3xl font-serif text-gray-900 mb-2 font-bold drop-shadow-sm">¡Nuestra Boda!</h1>
        <p class="text-gray-900 mb-4 text-sm sm:text-base font-medium drop-shadow-sm">Sube tus fotos y videos para conservar los mejores recuerdos de este gran día.</p>
        
        <!-- Nota informativa recomendada -->
        <div class="mb-4 bg-white/40 p-2.5 rounded-xl text-xs text-gray-900 font-medium border border-white/50">
            💡 <strong>Nota:</strong> Puedes seleccionar varios archivos a la vez (Recomendado: máximo 15 archivos por envío).
        </div>

        <form id="uploadForm" class="space-y-4">
            <div class="text-left">
                <label class="block text-sm font-semibold text-gray-900 mb-1">Tu Nombre (opcional)</label>
                <input type="text" id="nombre" placeholder="Ej. Familia Pinzón Soriano" class="w-full px-4 py-2.5 bg-white/70 border border-white/60 rounded-xl focus:ring-2 focus:ring-green-500 focus:outline-none transition text-gray-900 placeholder-gray-500">
            </div>
            
            <div class="text-left">
                <label class="block text-sm font-semibold text-gray-900 mb-1">Selecciona tus fotos o videos</label>
                <input type="file" id="foto" accept="image/*,video/*" multiple required class="w-full text-sm text-gray-800 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-pink-100/80 file:text-green-900 hover:file:bg-pink-200/80 cursor-pointer">
            </div>

            <!-- Previsualización múltiple en miniatura -->
            <div id="preview-container" class="hidden grid grid-cols-3 gap-2 mt-2 max-h-40 overflow-y-auto p-2 border border-white/40 rounded-xl bg-white/30"></div>

            <!-- Barra de Progreso Combinada (Secuencia + Porcentaje) -->
            <div id="progress-wrapper" class="hidden space-y-1.5">
                <div class="flex justify-between text-xs font-bold text-gray-900 px-1">
                    <span id="progress-sequence">Preparando archivos...</span>
                    <span id="progress-percentage">0%</span>
                </div>
                <div class="w-full bg-white/50 rounded-full h-3 overflow-hidden border border-white/60">
                    <div id="progress-bar" class="bg-green-600 h-full w-0 transition-all duration-300"></div>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-green-600 text-white py-3 rounded-xl font-semibold shadow-lg shadow-green-600/30 hover:bg-green-700 active:scale-[0.98] transition duration-200">
                Subir Recuerdos
            </button>
        </form>
        <div id="mensaje" class="mt-4 text-sm font-semibold"></div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const mensaje = document.getElementById('mensaje');
        const btnSubmit = document.getElementById('btnSubmit');
        const fotoInput = document.getElementById('foto');
        const previewContainer = document.getElementById('preview-container');
        const progressWrapper = document.getElementById('progress-wrapper');
        const progressBar = document.getElementById('progress-bar');
        const progressSequence = document.getElementById('progress-sequence');
        const progressPercentage = document.getElementById('progress-percentage');

        // Vista previa múltiple para imágenes y videos
        fotoInput.addEventListener('change', (e) => {
            previewContainer.innerHTML = '';
            const files = e.target.files;
            if (files && files.length > 0) {
                previewContainer.classList.remove('hidden');
                Array.from(files).forEach(file => {
                    const fileURL = URL.createObjectURL(file);
                    if (file.type.startsWith('video/')) {
                        const video = document.createElement('video');
                        video.src = fileURL;
                        video.className = 'w-full h-20 object-cover rounded-lg shadow-sm border border-white/60';
                        video.muted = true;
                        previewContainer.appendChild(video);
                    } else {
                        const img = document.createElement('img');
                        img.src = fileURL;
                        img.className = 'w-full h-20 object-cover rounded-lg shadow-sm border border-white/60';
                        previewContainer.appendChild(img);
                    }
                });
            } else {
                previewContainer.classList.add('hidden');
            }
        });

        // Animación de fuegos artificiales
        function explosionFuegos() {
            var duration = 2 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 999 };

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: Math.random() * 0.4 + 0.1, y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: Math.random() * 0.4 + 0.5, y: Math.random() - 0.2 } }));
            }, 200);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSubmit.disabled = true;
            mensaje.textContent = '';
            progressWrapper.classList.remove('hidden');

            explosionFuegos();

            const nombre = document.getElementById('nombre').value;
            const files = fotoInput.files;
            const totalFiles = files.length;
            let successCount = 0;

            try {
                for (let i = 0; i < totalFiles; i++) {
                    const currentNum = i + 1;
                    const percent = Math.round(((i) / totalFiles) * 100);
                    
                    // Actualizar textos de secuencia y porcentaje en tiempo real
                    progressSequence.textContent = `Subiendo archivo ${currentNum} de ${totalFiles}`;
                    progressPercentage.textContent = `${percent}%`;
                    progressBar.style.width = `${percent}%`;

                    const formData = new FormData();
                    formData.append('nombre', nombre);
                    formData.append('foto', files[i]);

                    const response = await fetch('/api/upload', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || 'Error al subir');
                    successCount++;
                }

                // Al finalizar con éxito
                progressSequence.textContent = `¡Completado (${totalFiles} de ${totalFiles})!`;
                progressPercentage.textContent = '100%';
                progressBar.style.width = '100%';

                mensaje.textContent = `¡${successCount} recuerdos subidos con éxito! Gracias por compartir.`;
                mensaje.className = 'mt-4 text-sm font-bold text-green-900 bg-white/60 p-2 rounded-xl';
                form.reset();
                previewContainer.classList.add('hidden');
                previewContainer.innerHTML = '';
            } catch (error) {
                mensaje.textContent = 'Hubo un error al subir algún archivo. Asegúrate de que los videos no sean demasiado pesados.';
                mensaje.className = 'mt-4 text-sm font-bold text-red-900 bg-white/60 p-2 rounded-xl';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Subir Recuerdos';
                setTimeout(() => {
                    progressWrapper.classList.add('hidden');
                    progressBar.style.width = '0%';
                }, 5000);
            }
        });
    </script>
</body>
</html>
