<!-- Aqui los invitados van a subir sus fotos -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparte las fotos de nuestra Boda</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-md w-full text-center">
        <h1 class="text-3xl font-serif text-gray-800 mb-2">¡Nuestra Boda!</h1>
        <p class="text-gray-600 mb-6">Sube tus fotos y ayúdanos a conservar los mejores recuerdos de este gran día.</p>
        
        <form id="uploadForm" class="space-y-4">
            <div>
                <label class="block text-left text-sm font-medium text-gray-700 mb-1">Tu Nombre (opcional)</label>
                <input type="text" id="nombre" placeholder="Ej. Familia Pinzón Soriano" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 focus:outline-none">
            </div>
            
            <div>
                <label class="block text-left text-sm font-medium text-gray-700 mb-1">Selecciona una foto</label>
                <input type="file" id="foto" accept="image/*" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-pink-50 file:text-green-700 hover:file:bg-pink-100">
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition duration-200">
                Subir Recuerdo
            </button>
        </form>
        <div id="mensaje" class="mt-4 text-sm font-medium"></div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const mensaje = document.getElementById('mensaje');
        const btnSubmit = document.getElementById('btnSubmit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Subiendo...';
            mensaje.textContent = '';

            const formData = new FormData();
            formData.append('nombre', document.getElementById('nombre').value);
            formData.append('foto', document.getElementById('foto').files[0]);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (response.ok) {
                    mensaje.textContent = '¡Foto subida con éxito! Gracias por compartir.';
                    mensaje.className = 'mt-4 text-sm font-medium text-green-600';
                    form.reset();
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                mensaje.textContent = 'Error al subir la foto. Inténtalo de nuevo.';
                mensaje.className = 'mt-4 text-sm font-medium text-red-600';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Subir Recuerdo';
            }
        });
    </script>
</body>
</html>
