<!-- Aqui los invitados van a subir sus fotos -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparte las fotos de nuestra Boda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería de chispitas/confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.min.js"></script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative bg-cover bg-center" style="background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('img/fondo-boda.jpg');">

    <!-- Tarjeta con efecto glassmorphism -->
    <div class="bg-white/95 backdrop-blur-md p-6 sm:p-8 rounded-3xl shadow-2xl max-w-md w-full text-center border border-white/40">
        <h1 class="text-3xl font-serif text-gray-800 mb-2">¡Nuestra Boda!</h1>
        <p class="text-gray-600 mb-6 text-sm sm:text-base">Sube tus fotos y ayúdanos a conservar los mejores recuerdos de este gran día.</p>
        
        <form id="uploadForm" class="space-y-4">
            <div class="text-left">
                <label class="block text-sm font-medium text-gray-700 mb-1">Tu Nombre (opcional)</label>
                <input type="text" id="nombre" placeholder="Ej. Familia Pinzón Soriano" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-pink-400 focus:outline-none transition">
            </div>
            
            <div class="text-left">
                <label class="block text-sm font-medium text-gray-700 mb-1">Selecciona una foto</label>
                <input type="file" id="foto" accept="image/*" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-pink-50 file:text-green-700 hover:file:bg-pink-100 cursor-pointer">
            </div>

            <!-- Vista previa opcional de la foto seleccionada -->
            <div id="preview-container" class="hidden mt-2">
                <img id="image-preview" src="#" alt="Vista previa" class="w-full h-36 object-cover rounded-xl border border-gray-200 shadow-sm">
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-green-600 text-white py-3 rounded-xl font-semibold shadow-lg shadow-green-600/30 hover:bg-green-700 active:scale-[0.98] transition duration-200">
                Subir Recuerdo
            </button>
        </form>
        <div id="mensaje" class="mt-4 text-sm font-medium"></div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const mensaje = document.getElementById('mensaje');
        const btnSubmit = document.getElementById('btnSubmit');
        const fotoInput = document.getElementById('foto');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');

        // Mostrar vista previa cuando el invitado selecciona una foto
        fotoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                imagePreview.src = URL.createObjectURL(file);
                previewContainer.classList.remove('hidden');
            } else {
                previewContainer.classList.add('hidden');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Subiendo...';
            mensaje.textContent = '';

            // Lanzar chispitas de celebración al hacer clic en enviar
            confetti({
                particleCount: 60,
                spread: 70,
                origin: { y: 0.8 },
                colors: ['#ffd700', '#ffffff', '#22c55e', '#ec4899']
            });

            const formData = new FormData();
            formData.append('nombre', document.getElementById('nombre').value);
            formData.append('foto', fotoInput.files[0]);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (response.ok) {
                    mensaje.textContent = '¡Foto subida con éxito! Gracias por compartir.';
                    mensaje.className = 'mt-4 text-sm font-medium text-green-600';
                    form.reset();
                    previewContainer.classList.add('hidden');
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                mensaje.textContent = 'Error al subir la foto. Inténtalo de nuevo.';
                mensaje.className = 'mt-4 text-sm font-medium text-red-600';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Subir Recuerdo';
            }
        });
    </script>
</body>
</html>
