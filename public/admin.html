<!-- Generador de codigo QR por mesas -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador QR - Boda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl text-center max-w-sm w-full">
        <h1 class="text-2xl font-serif mb-4 text-gray-800">Código QR para Mesas</h1>
        <p class="text-gray-600 text-sm mb-6">Coloca este código QR en las mesas de la recepción.</p>
        
        <div id="qrcode" class="flex justify-center mb-6"></div>
        
        <p id="urlTexto" class="text-xs text-gray-400 break-all"></p>
    </div>

    <script>
        const urlActual = window.location.origin;
        document.getElementById('urlTexto').textContent = urlActual;

        new QRCode(document.getElementById("qrcode"), {
            text: urlActual,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
